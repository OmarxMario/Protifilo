<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCAR Cinematic</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      transition: 0.3s ease;
      font-family: 'Poppins', sans-serif;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    /* Background Video with Overlay */
    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -99;
      filter: brightness(0.6);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.8));
      z-index: -98;
    }

    /* Header */
    header {
      width: 90%;
      max-width: 1200px;
      margin: 20px auto;
      padding: 15px 30px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slide-header 7s ease-in-out  alternate;
    }

    header span {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    header nav {
      display: flex;
      gap: 25px;
    }

    header a {
      color: #fff;
      font-size: 22px;
    }

    /* Hover effects */
    .ins:hover { color: #ffa947; text-shadow: 0 0 15px #ffa947; transform: translateY(-5px); }
    .tik:hover { color: #fc7de7; text-shadow: 0 0 15px #fc7de7; transform: translateY(-5px); }
    .wat:hover { color: #00ef00; text-shadow: 0 0 15px #00ef00; transform: translateY(-5px); }

    /* Content */
    .content {
      height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      text-align: center;
      animation: slide-content 7s ease-in-out  alternate;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 5px 20px rgba(0,0,0,0.6);
    }

    button {
      padding: 15px 45px;
      border: none;
      background: linear-gradient(135deg, #0059fe, #00d2ff);
      color: #fff;
      font-size: 18px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      box-shadow: 0 0 25px rgba(0, 150, 255, 0.7);
      transform: translateY(-8px);
    }

    /* Keyframes with 0% → 75% idle → 100% move */
    @keyframes slide-header {
      0%, 75% { transform: translateX(-150%); opacity: 0; }
      100%    { transform: translateX(0); opacity: 1; }
    }

    @keyframes slide-content {
      0%, 75% { transform: translateY(100%); opacity: 0; }
      100%    { transform: translateY(0); opacity: 1; }
    }

    /* Mobile */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 15px;
      }
      header span { font-size: 24px; }
      header nav { gap: 15px; }
      h1 { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <video src="vedio/bk.mp4" autoplay muted loop></video>
  <div class="overlay"></div>

  <header>
    <span>OCAR</span>
    <nav>
      <a href="#" class="ins"><i class="fa-brands fa-instagram"></i></a>
      <a href="#" class="tik"><i class="fa-brands fa-tiktok"></i></a>
      <a href="#" class="wat"><i class="fa-brands fa-whatsapp"></i></a>
    </nav>
  </header>

  <div class="content">
    <h1>Welcome to OCAR</h1>
    <button>Explore Now <i class="fa-solid fa-bag-shopping"></i></button>
  </div>
</body>
</html>

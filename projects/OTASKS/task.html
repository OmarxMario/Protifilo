<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <title>Otask</title>
  <style>
    *{margin:0;padding:0;font-family: 'Inter', sans-serif;transition: background 0.4s, color 0.4s;}
    :root{--main-color: #1976d2;--white:#f3f3f3;--black:#121212;}
    body{width:100vw;overflow:hidden;min-height:100vh;background:var(--bk);color:var(--c);}
    .light{--bk:var(--white);--c:var(--black);}
    .dark{--bk:var(--black);--c:var(--white);}
    button{border:var(--main-color)1.7px solid;background:#0000;font-size:21px;margin:10px;padding:3px;border-radius:8px;cursor:pointer;color:var(--main-color);}
    button:hover{color:var(--white);background:var(--main-color);}
    header{display:flex;justify-content:space-around;align-items: center; margin-block:10px;border:var(--main-color)1.7px solid;width:95vw;border-radius:8px;box-shadow: 0 4px 12px rgba(18, 113, 255, 0.3);}
    label{outline:none;font-size: 25px;}
    .continer{width:95vw;border:var(--main-color)1.7px solid;border-radius:8px;height:80vh;overflow-y:auto;overflow-x:hidden;box-shadow: 0 4px 12px rgba(18, 113, 255, 0.3);display:flex;flex-direction:column;align-items:center;gap:10px;}
    .card{width:80%;display:flex;border:var(--main-color)1.7px solid;margin:10px;box-shadow: 0 4px 12px rgba(18, 113, 255, 0.3);border-radius:8px;justify-content:space-between;align-items:center;padding:10px;flex-wrap: wrap;}
    input[type="checkbox"]{width:20px;height:20px;cursor:pointer;}
    .done{text-decoration:line-through;opacity:0.6;}
    ::-webkit-scrollbar{width: 5px;}::-webkit-scrollbar-thumb{background: var(--main-color);}
    .card {transition: transform 0.4s ease, opacity 0.4s ease;}
    .card.removed {opacity: 0;transform: translateX(50%);}
    @media(max-width:500px){
      .card{width:95%;}
    }
    /* Popup background */
.popup {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: none;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.6);
  z-index: 1000;
}

/* Show popup */
.popup.show {
  display: flex;
  animation: fadeIn 0.3s ease;
}
.popup.h {
  display: flex;
  animation: fadeOut 0.3s ease;
}

/* Popup content box */
.popup-content {
  border:var(--main-color)1.7px solid;

  background: var(--bk);
  color: var(--c);
  padding: 20px;
  border-radius: 12px;
  width: 300px;
  text-align: center;
  box-shadow: 0 6px 20px rgba(18, 113, 255, 0.3);
  animation: slideUp 0.3s ease;
}

/* Buttons */
.popup-buttons {
  margin-top: 20px;
  display: flex;
  justify-content: space-around;
}

.popup button {
  padding: 8px 14px;
  font-size: 16px;
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes fadeOut {
  from { opacity: 1; }
  to { opacity: 0; }
}
@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

  </style>
</head>
<body class="light">
  <center>
    <header>
      <h1>Otask</h1>
      <nav>
        <button id="addBtn"><i class="fa-solid fa-plus"></i></button>
        <button id="clearBtn"><i class="fa-solid fa-trash-can"></i></button>
        <button id="themeBtn"><i class="fa-solid fa-moon"></i></button>
      </nav>
    </header>
  </center>
  <center>
    <div class="continer" id="taskContainer"></div>
  </center>
  <div id="popup" class="popup">
    <div class="popup-content">
      <h2>Delete All Tasks?</h2>
      <br>
      <p>Are you sure you want to remove all tasks? This action cannot be undone.</p>
      <div class="popup-buttons">
        <button id="cancelBtn">Cancel</button>
        <button id="confirmBtn">Delete</button>
      </div>
    </div>
  </div>
  

  <script>
    const addBtn = document.getElementById("addBtn");
    const clearBtn = document.getElementById("clearBtn");
    const themeBtn = document.getElementById("themeBtn");
    const taskContainer = document.getElementById("taskContainer");
    const body = document.body;
    const popup = document.getElementById("popup");
const cancelBtn = document.getElementById("cancelBtn");
const confirmBtn = document.getElementById("confirmBtn");

// Open popup
clearBtn.addEventListener("click", () => {
  popup.classList.add("show");
});

// Cancel button closes popup
cancelBtn.addEventListener("click", () => {
  popup.classList.remove("show");
});



    function loadTheme() {
      const savedTheme = localStorage.getItem("theme") || "light";
      body.classList.remove("light", "dark");
      body.classList.add(savedTheme);
      themeBtn.innerHTML = savedTheme === "dark"
        ? '<i class="fa-solid fa-sun"></i>'
        : '<i class="fa-solid fa-moon"></i>';
    }
    function saveTheme() {
      const theme = body.classList.contains("dark") ? "dark" : "light";
      localStorage.setItem("theme", theme);
    }
    function loadTasks() {
      const saved = JSON.parse(localStorage.getItem("tasks")) || [];
      taskContainer.innerHTML = "";
      saved.forEach(task => addTask(task.text, task.done));
    }
    function saveTasks() {
      const tasks = [];
      taskContainer.querySelectorAll(".card").forEach(card => {
        const text = card.querySelector("label").innerText;
        const done = card.querySelector("input[type='checkbox']").checked;
        tasks.push({ text, done });
      });
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }
    function addTask(text="New Task", done=false) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <label contenteditable="true">${text}</label>
        <nav>
          <input type="checkbox" ${done ? "checked" : ""}>
          <button class="deleteBtn"><i class="fa-solid fa-trash"></i></button>
        </nav>
      `;
      if(done) card.querySelector("label").classList.add("done");
      taskContainer.appendChild(card);
    }
    themeBtn.addEventListener("click", () => {
      body.classList.toggle("dark");
      body.classList.toggle("light");
      themeBtn.innerHTML = body.classList.contains("dark")
        ? '<i class="fa-solid fa-sun"></i>'
        : '<i class="fa-solid fa-moon"></i>';
      saveTheme();
    });
    addBtn.addEventListener("click", () => {
      addTask();
      saveTasks();
    });
    confirmBtn.addEventListener("click", () => {
      const cards = taskContainer.querySelectorAll(".card");
    
      cards.forEach((card, index) => {
        setTimeout(() => {
          card.classList.add("removed");
          setTimeout(() => {
            card.remove();
            if (index === cards.length - 1) saveTasks();
          }, 300);
        }, index * 100);
      });
      
      popup.classList.remove("show");
      
    });
    
    taskContainer.addEventListener("click", (e) => {
      if (e.target.closest(".deleteBtn")) {
        const card = e.target.closest(".card");
        card.classList.add("removed");
        setTimeout(() => {
          card.remove();
          saveTasks();
        }, 200);
      }
    });
    taskContainer.addEventListener("change", (e) => {
      if (e.target.type === "checkbox") {
        const taskTitle = e.target.closest(".card").querySelector("label");
        taskTitle.classList.toggle("done", e.target.checked);
        saveTasks();
      }
    });
    taskContainer.addEventListener("input", (e) => {
      if (e.target.tagName === "LABEL") {
        saveTasks();
      }
    });
    loadTheme();
    loadTasks();
  </script>
</body>
</html>

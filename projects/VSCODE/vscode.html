<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern IDE Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body, html { margin:0; padding:0; height:100%; font-family:'Fira Code', monospace; background:#1e1e2f; color:#fff; }
.ide { display:grid; grid-template-columns:70px 1fr; grid-template-rows:40px 40px 1fr 24px; height:100vh; }
/* Sidebar */
.sidebar { grid-row:2/4; background:#2b2b3a; display:flex; flex-direction:column; align-items:center; padding-top:15px; }
.sidebar button { background:none; border:none; color:#aaa; margin:12px 0; cursor:pointer; font-size:20px; width:45px; height:45px; display:flex; align-items:center; justify-content:center; border-radius:8px; transition:0.2s; }
.sidebar button:hover { background:#3a3a4f; color:#fff; }
.mac-win{display: flex;gap: 20px;}
.mac-btn{width: 15px;height: 15px;border-radius: 50%;}
.red{background: rgb(255, 72, 72);}
.yellow{background: rgb(255, 219, 121);}
.green{background: rgb(142, 255, 49);}
/* Header/Menu */
.header { grid-column:1/3; background:#2b2b3a; display:flex; align-items:center; padding:0 20px; font-size:14px; color:#ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.2); justify-content:flex-start; gap:25px; }
.header div { cursor:pointer; transition:0.2s; font-weight:500; }
.header div:hover { color:#fff; }
/* Editor scrollbar */
.editor {
    overflow-y: auto;
    scrollbar-width: thin;         /* Firefox */
    scrollbar-color: #1976d2 #2b2b3a; /* thumb color / track color */
  }
  
  /* Chrome, Edge, Safari */
  .editor::-webkit-scrollbar {
    width: 10px;                     /* scrollbar width */
  }
  
  .editor::-webkit-scrollbar-track {
    background: #2b2b3a;            /* track color */

  }
  
  .editor::-webkit-scrollbar-thumb {
    background-color: #1976d2;      /* thumb color */
    border: 2px solid #2b2b3a;      /* optional: adds padding around thumb */
  }
  
  .editor::-webkit-scrollbar-thumb:hover {
    background-color: #3399ff;      /* hover effect */
  }
  
/* Tabs */
.tabs { grid-column:2/3; display:flex; background:#222233; border-bottom:1px solid #444; padding-left:10px; }
.tab { background:#2b2b3a; color:#ccc; padding:6px 12px; margin-right:3px; cursor:pointer; border-top-left-radius:6px; border-top-right-radius:6px; display:flex; align-items:center; justify-content:space-between; min-width:130px; transition:0.2s; }
.tab.active { background:#1f1f2f; color:white; font-weight:bold; box-shadow: inset 0 -2px 0 #569cd6; }
.tab i { margin-right:6px; }
.tab .close { font-size:20px; color:#888; padding:2px 8px; cursor:pointer; border-radius:3px; flex-shrink:0; }
.tab .close:hover { color:white; background:#e81123; }

/* Editor */
.editor { grid-column:2/3; grid-row:3/4; background:#1e1e2f; color:#d0d0e0; padding:15px; overflow-y:auto; white-space:pre-wrap; word-wrap:break-word; font-size:14px; line-height:1.5; position:relative; border-radius:0 0 6px 6px; box-shadow: inset 0 0 15px rgba(0,0,0,0.3); }
.editor div:nth-child(even) { background:rgba(255,255,255,0.02); padding-left:4px; border-radius:3px; }

/* Syntax highlighting */
.tag { color:#569cd6; }
.attr { color:#9cdcfe; }
.value { color:#ce9178; }
.text { color:#d4d4d4; }
.js-keyword { color: #569cd6; font-weight: bold; }
.js-string { color: #d69d85; }
.js-variable { color: #9cdcfe; }
.js-comment { color: #6a9955; font-style: italic; }
.css-selector { color: #dcdcaa; }
.css-property { color: #9cdcfe; }
.css-value { color: #ce9178; }
.css-comment { color: #6a9955; font-style: italic; }


/* Footer */
.footer { grid-column:1/3; background:#2b2b3a; color:#ccc; display:flex; justify-content:space-between; padding:0 15px; align-items:center; font-size:12px; box-shadow:0 -2px 5px rgba(0,0,0,0.2); font-weight:500; }

/* Cursor */
.cursor { display:inline-block; width:2px; background:#fff; animation:blink 1s step-start infinite; }
@keyframes blink { 50% { background:transparent; } }
</style>
</head>
<body>

  <!-- Header -->
  <div class="header">

    <center>@omarpotato48 - fake ide for veiod editing only</center>

<script>
// Fake code lines with syntax highlighting
const codeLines = [
  // HTML
  '<span class="tag">&lt;!DOCTYPE html&gt;</span>',
  '<span class="tag">&lt;html</span> <span class="attr">lang</span>=<span class="value">"en"</span><span class="tag">&gt;</span>',
  '<span class="tag">&lt;head&gt;</span>',
  '  <span class="tag">&lt;meta</span> <span class="attr">charset</span>=<span class="value">"UTF-8"</span><span class="tag">&gt;</span>',
  '  <span class="tag">&lt;meta</span> <span class="attr">name</span>=<span class="value">"viewport"</span> <span class="attr">content</span>=<span class="value">"width=device-width, initial-scale=1.0"</span><span class="tag">&gt;</span>',
  '  <span class="tag">&lt;link</span> <span class="attr">href</span>=<span class="value">"https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"</span> <span class="attr">rel</span>=<span class="value">"stylesheet"</span><span class="tag">&gt;</span>',
  '  <span class="tag">&lt;link</span> <span class="attr">rel</span>=<span class="value">"stylesheet"</span> <span class="attr">href</span>=<span class="value">"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"</span><span class="tag">&gt;</span>',
  '  <span class="tag">&lt;title&gt;</span>Otask<span class="tag">&lt;/title&gt;</span>',
  '  <span class="tag">&lt;style&gt;</span>',
  '    <span class="css-comment">/* General styles */</span>',
  '    <span class="css-selector">*{</span><span class="css-property">margin</span>:0;<span class="css-property">padding</span>:0;<span class="css-property">font-family</span>:\'Inter\',sans-serif; <span class="css-property">transition</span>:background 0.4s,color 0.4s;}',
  '    <span class="css-selector">body</span>{<span class="css-property">background</span>:#f3f3f3;<span class="css-property">color</span>#121212;<span class="css-property">overflow</span>:hidden;}',
  '    <span class="css-selector">.dark</span>{<span class="css-property">background</span>:#121212;<span class="css-property">color</span>#f3f3f3;}',
  '    <span class="css-selector">button</span>{<span class="css-property">border</span>:2px solid #1976d2;<span class="css-property">background</span>:transparent;<span class="css-property">cursor</span>:pointer;<span class="css-property">border-radius</span>:8px;<span class="css-property">padding</span>:3px 10px;}',
  '    <span class="css-selector">button:hover</span>{<span class="css-property">background</span>:#1976d2;<span class="css-property">color</span>#fff;}',
  '    <span class="css-selector">header</span>{<span class="css-property">display</span>:flex;<span class="css-property">justify-content</span>:space-around;<span class="css-property">align-items</span>:center;<span class="css-property">margin-block</span>:10px;<span class="css-property">border</span>:2px solid #1976d2;<span class="css-property">width</span>:95vw;<span class="css-property">border-radius</span>:8px;}',
  '    <span class="css-selector">.continer</span>{<span class="css-property">width</span>:95vw;<span class="css-property">border</span>:2px solid #1976d2;<span class="css-property">border-radius</span>:8px;<span class="css-property">height</span>:80vh;<span class="css-property">overflow-y</span>:auto;<span class="css-property">display</span>:flex;<span class="css-property">flex-direction</span>:column;<span class="css-property">align-items</span>:center;<span class="css-property">gap</span>:10px;}',
  '    <span class="css-selector">.card</span>{<span class="css-property">width</span>:80%;<span class="css-property">display</span>:flex;<span class="css-property">border</span>:2px solid #1976d2;<span class="css-property">margin</span>:10px;<span class="css-property">box-shadow</span>:0 4px 12px rgba(18,113,255,0.3);<span class="css-property">border-radius</span>:8px;<span class="css-property">justify-content</span>:space-between;<span class="css-property">align-items</span>:center;<span class="css-property">padding</span>:10px;<span class="css-property">flex-wrap</span>:wrap;}',
  '    <span class="css-selector">.done</span>{<span class="css-property">text-decoration</span>:line-through;<span class="css-property">opacity</span>:0.6;}',
  '    <span class="css-selector">::-webkit-scrollbar</span>{<span class="css-property">width</span>:5px;}',
  '    <span class="css-selector">::-webkit-scrollbar-thumb</span>{<span class="css-property">background</span>#1976d2;}',
  '  <span class="tag">&lt;/style&gt;</span>',
  '<span class="tag">&lt;/head&gt;</span>',
  '<span class="tag">&lt;body</span> <span class="attr">class</span>=<span class="value">"light"</span><span class="tag">&gt;</span>',
  '  <span class="tag">&lt;header&gt;</span>',
  '    <span class="tag">&lt;h1&gt;</span>Otask<span class="tag">&lt;/h1&gt;</span>',
  '    <span class="tag">&lt;nav&gt;</span>',
  '      <span class="tag">&lt;button</span> <span class="attr">id</span>=<span class="value">"addBtn"</span><span class="tag">&gt;</span><span class="text"><i class="fa-solid fa-plus"></i></span><span class="tag">&lt;/button&gt;</span>',
  '      <span class="tag">&lt;button</span> <span class="attr">id</span>=<span class="value">"clearBtn"</span><span class="tag">&gt;</span><span class="text"><i class="fa-solid fa-trash-can"></i></span><span class="tag">&lt;/button&gt;</span>',
  '      <span class="tag">&lt;button</span> <span class="attr">id</span>=<span class="value">"themeBtn"</span><span class="tag">&gt;</span><span class="text"><i class="fa-solid fa-moon"></i></span><span class="tag">&lt;/button&gt;</span>',
  '    <span class="tag">&lt;/nav&gt;</span>',
  '  <span class="tag">&lt;/header&gt;</span>',
  '  <span class="tag">&lt;div</span> <span class="attr">id</span>=<span class="value">"taskContainer"</span> <span class="attr">class</span>=<span class="value">"continer"</span><span class="tag">&gt;</span><span class="tag">&lt;/div&gt;</span>',
  '  <span class="tag">&lt;div</span> <span class="attr">id</span>=<span class="value">"popup"</span> <span class="attr">class</span>=<span class="value">"popup"</span><span class="tag">&gt;</span>',
  '    <span class="tag">&lt;div</span> <span class="attr">class</span>=<span class="value">"popup-content"</span><span class="tag">&gt;</span>',
  '      <span class="tag">&lt;h2&gt;</span>Delete All Tasks?<span class="tag">&lt;/h2&gt;</span>',
  '      <span class="tag">&lt;p&gt;</span>Are you sure you want to remove all tasks? This action cannot be undone.<span class="tag">&lt;/p&gt;</span>',
  '      <span class="tag">&lt;div</span> <span class="attr">class</span>=<span class="value">"popup-buttons"</span><span class="tag">&gt;</span>',
  '        <span class="tag">&lt;button</span> <span class="attr">id</span>=<span class="value">"cancelBtn"</span><span class="tag">&gt;</span>Cancel<span class="tag">&lt;/button&gt;</span>',
  '        <span class="tag">&lt;button</span> <span class="attr">id</span>=<span class="value">"confirmBtn"</span><span class="tag">&gt;</span>Delete<span class="tag">&lt;/button&gt;</span>',
  '      <span class="tag">&lt;/div&gt;</span>',
  '    <span class="tag">&lt;/div&gt;</span>',
  '  <span class="tag">&lt;/div&gt;</span>'
];

// JS full logic
codeLines.push(
  '<span class="tag">&lt;script&gt;</span>',
  '<span class="js-keyword">const</span> <span class="js-variable">addBtn</span> = document.getElementById(<span class="js-string">"addBtn"</span>);',
  '<span class="js-keyword">const</span> <span class="js-variable">clearBtn</span> = document.getElementById(<span class="js-string">"clearBtn"</span>);',
  '<span class="js-keyword">const</span> <span class="js-variable">themeBtn</span> = document.getElementById(<span class="js-string">"themeBtn"</span>);',
  '<span class="js-keyword">const</span> <span class="js-variable">taskContainer</span> = document.getElementById(<span class="js-string">"taskContainer"</span>);',
  '<span class="js-keyword">const</span> <span class="js-variable">body</span> = document.body;',
  '<span class="js-keyword">const</span> <span class="js-variable">popup</span> = document.getElementById(<span class="js-string">"popup"</span>);',
  '<span class="js-keyword">const</span> <span class="js-variable">cancelBtn</span> = document.getElementById(<span class="js-string">"cancelBtn"</span>);',
  '<span class="js-keyword">const</span> <span class="js-variable">confirmBtn</span> = document.getElementById(<span class="js-string">"confirmBtn"</span>);',
  '',
  '<span class="js-comment">// Theme toggle</span>',
  '<span class="js-variable">themeBtn</span>.addEventListener(<span class="js-string">"click"</span>, () => {',
  '  body.classList.toggle(<span class="js-string">"dark"</span>);',
  '  body.classList.toggle(<span class="js-string">"light"</span>);',
  '  localStorage.setItem(<span class="js-string">"theme"</span>, body.classList.contains(<span class="js-string">"dark"</span>) ? <span class="js-string">"dark"</span> : <span class="js-string">"light"</span>);',
  '});',
  '',
  '<span class="js-comment">// Load saved theme</span>',
  '<span class="js-keyword">if</span>(localStorage.getItem(<span class="js-string">"theme"</span>) === <span class="js-string">"dark"</span>) body.classList.add(<span class="js-string">"dark"</span>);',
  '',
  '<span class="js-comment">// Add task</span>',
  '<span class="js-keyword">function</span> <span class="js-variable">addTask</span>(<span class="js-variable">text</span>=<span class="js-string">"New Task"</span>, <span class="js-variable">done</span>=false) {',
  '  <span class="js-keyword">const</span> <span class="js-variable">card</span> = document.createElement(<span class="js-string">"div"</span>);',
  '  card.className = <span class="js-string">"card"</span>;',
  '  card.innerHTML = `<span class="tag">&lt;label&gt;</span>${text}<span class="tag">&lt;/label&gt;</span><nav><input type="checkbox" ${done ? "checked" : ""}><button class="deleteBtn"><i class="fa-solid fa-trash"></i></button></nav>`;',
  '  if(done) card.querySelector("label").classList.add(<span class="js-string">"done"</span>);',
  '  taskContainer.appendChild(card);',
  '}',
  '',
  '<span class="js-comment">// Load saved tasks</span>',
  '<span class="js-keyword">JSON.parse</span>(localStorage.getItem(<span class="js-string">"tasks"</span>) || <span class="js-string">"[]"</span>).forEach(task => addTask(task.text, task.done));',
  '',
  '<span class="js-comment">// Save tasks</span>',
  '<span class="js-keyword">function</span> <span class="js-variable">saveTasks</span>() {',
  '  <span class="js-keyword">const</span> <span class="js-variable">tasks</span> = [];',
  '  taskContainer.querySelectorAll(".card").forEach(card => {',
  '    tasks.push({',
  '      text: card.querySelector("label").innerText,',
  '      done: card.querySelector("input[type=\'checkbox\']").checked',
  '    });',
  '  });',
  '  localStorage.setItem(<span class="js-string">"tasks"</span>, JSON.stringify(tasks));',
  '}',
  '',
  '<span class="js-comment">// Event listeners</span>',
  'addBtn.addEventListener(<span class="js-string">"click"</span>, () => { addTask(); saveTasks(); });',
  'clearBtn.addEventListener(<span class="js-string">"click"</span>, () => { popup.classList.add(<span class="js-string">"show"</span>); });',
  'cancelBtn.addEventListener(<span class="js-string">"click"</span>, () => popup.classList.remove(<span class="js-string">"show"</span>));',
  'confirmBtn.addEventListener(<span class="js-string">"click"</span>, () => { taskContainer.innerHTML = ""; localStorage.removeItem(<span class="js-string">"tasks"</span>); popup.classList.remove(<span class="js-string">"show"</span>); });',
  'taskContainer.addEventListener("click", e => {',
  '  if(e.target.closest(".deleteBtn")) {',
  '    e.target.closest(".card").remove();',
  '    saveTasks();',
  '  }',
  '});',
  'taskContainer.addEventListener("change", e => {',
  '  if(e.target.type === "checkbox") {',
  '    e.target.closest("label").classList.toggle("done", e.target.checked);',
  '    saveTasks();',
  '  }',
  '});',
  'taskContainer.addEventListener("input", e => { if(e.target.tagName === "LABEL") saveTasks(); });',
  '<span class="tag">&lt;/script&gt;</span>',
  '<span class="tag">&lt;/body&gt;</span>',
  '<span class="tag">&lt;/html&gt;</span>'
)

let currentLine = 0;
const editor = document.getElementById('editor');
const cursor = document.querySelector('.cursor');
const footer = document.getElementById('cursor-pos');

// Show one line at a time
function typeLine() {
  if (currentLine >= codeLines.length) return;

  const line = document.createElement('div');
  line.style.opacity = 0; // start invisible
  line.innerHTML = codeLines[currentLine]; // keep spans intact
  editor.insertBefore(line, cursor);

  // Fade in the line
  setTimeout(() => {
    line.style.transition = 'opacity 0.3s ease';
    line.style.opacity = 1;
    editor.scrollTop = editor.scrollHeight;
    updateFooter();
  }, 50);

  currentLine++;
}

// Update footer with current line
function updateFooter() {
  footer.textContent = `Ln ${currentLine}, Col 1`;
}

// Press Enter to type next line
window.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    typeLine();
  }
});



// Tab close buttons
document.querySelectorAll('.tab .close').forEach(btn=>{
  btn.addEventListener('click', e=>{
    const tab = e.target.parentElement;
    tab.remove();
    const tabs = document.querySelectorAll('.tab');
    if(!document.querySelector('.tab.active') && tabs.length) tabs[0].classList.add('active');
  });
});
</script>

</body>
</html>
